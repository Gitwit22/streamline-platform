version: "1"

services:
  # -------------------------
  # BACKEND (TEST)
  # -------------------------
  - type: web
    name: streamline-backend2test
    runtime: node
    plan: free
    repo: https://github.com/Gitwit22/streamline-platform
    branch: test
    rootDir: streamline-server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

      # LiveKit (backend uses HTTPS URL)
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false

      # Public https origin of THIS backend, e.g. https://<backend-host>
      # (no trailing path). LiveKit egress loads
      # <origin>/egress-templates/program-compositor.html so RTMP / HLS /
      # recordings / Instagram follow the host's program layout. If unset the
      # server falls back to Render's RENDER_EXTERNAL_URL, then to LiveKit's
      # built-in layouts (layout choices ignored).
      - key: EGRESS_TEMPLATE_BASE_URL
        sync: false

      # Auth
      - key: JWT_SECRET
        sync: false

      # Maintenance
      - key: MAINTENANCE_KEY
        sync: false

      # Streaming meter (server-owned monthly streaming minutes).
      # ISO timestamp; output time before it is never billed by the meter.
      # Set to the deploy time of the meter release so streams running across
      # the deploy are not double-billed (old-model billed sessions are always
      # skipped). Empty = no cutover.
      - key: STREAMING_METER_CUTOVER_ISO
        sync: false
      # In-process meter sweep interval in ms (default 120000; "0" disables
      # and relies on the cron hitting /api/maintenance/streaming-meter-sweep).
      - key: STREAMING_METER_SWEEP_MS
        sync: false

      # Scheduled jobs (lib/jobs; admin view: Admin Dashboard > System Jobs).
      # JOBS_ENABLED=0 turns off the in-process scheduler (cron + admin
      # "Run now" still work). JOB_<NAME>_MS overrides one job's interval,
      # e.g. JOB_MEDIA_PURGE_MS=1800000 ("0" disables its timer).
      # EXPORT_RETENTION_DAYS (default 30, "0" = keep forever) expires rendered
      # export files; JOB_HISTORY_RETENTION_DAYS / STRIPE_EVENT_RETENTION_DAYS
      # (default 30) bound jobRuns / stripeEvents.
      - key: JOBS_ENABLED
        sync: false
      - key: EXPORT_RETENTION_DAYS
        sync: false

      # Firebase (if you use it server-side)
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false

      # R2 (only if multistream/recording uses it)
      - key: R2_ACCOUNT_ACCESS_KEY_ID
        sync: false
      - key: R2_ACCOUNT_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_USER_ACCESS_KEY_ID
        sync: false
      - key: R2_USER_SECRET_ACCESS_KEY
        sync: false

  # -------------------------
  # FRONTEND (TEST)
  # -------------------------
  - type: web
    name: streamline-platform-test
    runtime: static
    repo: https://github.com/Gitwit22/streamline-platform
    branch: test
    rootDir: streamline-client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      # Frontend calls backend
      - key: VITE_API_BASE
        sync: false

      # Frontend connects to LiveKit via WSS
      - key: VITE_LIVEKIT_URL
        sync: false

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      # Allow the live viewer page to be embedded in iframes on customer sites.
      # Keep X-Frame-Options absent for /live/* so legacy browsers also allow framing.
      - path: /live/*
        name: Content-Security-Policy
        value: "frame-ancestors *"
      - path: /ig/*
        name: Content-Security-Policy
        value: "frame-ancestors *"

  # -------------------------
  # MAINTENANCE CRON (TEST)
  # Backstop for the scheduled jobs (lib/jobs): POSTs
  # /api/maintenance/jobs/run-due, which runs every job whose interval has
  # elapsed (media purge, account purge, recording enforcement, meter sweep,
  # stale HLS, expired sessions, temp uploads, expired exports). The web
  # service also runs them in-process; Firestore leases prevent double runs.
  # Needed because the free web plan sleeps when idle. (Service name kept so
  # the existing Render cron is updated in place.)
  # -------------------------
  - type: cron
    name: streamline-expire-emergency-recordings
    runtime: node
    plan: free
    repo: https://github.com/Gitwit22/streamline-platform
    branch: test
    rootDir: streamline-server
    buildCommand: npm ci --include=dev && npm run build
    schedule: "*/10 * * * *"
    command: npm run cron:run-jobs
    envVars:
      # https://<backend>/api/maintenance/jobs/run-due. Optional if
      # MAINTENANCE_EXPIRE_URL (legacy) is set: its origin is reused.
      - key: MAINTENANCE_JOBS_URL
        sync: false
      - key: MAINTENANCE_EXPIRE_URL
        sync: false
      - key: MAINTENANCE_KEY
        sync: false
