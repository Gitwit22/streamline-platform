# Exported from Render on 2025-12-17T11:44:21Z
version: "1"
projects:
- name: StreamLine
  environments:
  - name: Production
    services:
    - type: web
      name: streamline-backend2
      runtime: node
      repo: https://github.com/Gitwit22/streamline-platform
      plan: free
      envVars:
      - key: NODE_ENV
        value: production
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false
      - key: MAINTENANCE_KEY
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_USER_SECRET_ACCESS_KEY
        sync: false
      - key: R2_USER_ACCESS_KEY_ID
        sync: false
      - key: R2_ACCOUNT_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ACCOUNT_ACCESS_KEY_ID
        sync: false

      # R2 names the code actually reads (lib/storageClient.ts). The
      # R2_BUCKET_NAME / R2_*_ACCESS_KEY_ID keys above are not read by the code;
      # they're kept so a blueprint sync never touches existing values.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false

      # Billing: frontend URL for Stripe/PPV redirects + plan price IDs
      # (checkout returns 500 without the price IDs).
      - key: CLIENT_URL
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_BASIC
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: VITE_API_BASE
        sync: false
      - key: PORT
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: ROOM_ACCESS_TOKEN_SECRET
        sync: false
      - key: VITE_LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_URL
        sync: false
      # Public https origin of this backend, e.g. https://<backend-host>.
      # LiveKit egress loads <origin>/egress-templates/program-compositor.html
      # so every output follows the host's program layout. Falls back to
      # RENDER_EXTERNAL_URL, then to LiveKit built-in layouts.
      - key: EGRESS_TEMPLATE_BASE_URL
        sync: false
      region: ohio
      buildCommand: npm ci --include=dev && npm run build
      startCommand: npm run start
      autoDeployTrigger: checksPass
      rootDir: streamline-server

    - type: cron
      name: streamline-expire-emergency-recordings
      runtime: node
      repo: https://github.com/Gitwit22/streamline-platform
      plan: free
      region: ohio
      rootDir: streamline-server
      buildCommand: npm ci --include=dev && npm run build
      schedule: "*/10 * * * *"
      # Scheduled-jobs backstop: POST /api/maintenance/jobs/run-due
      command: npm run cron:run-jobs
      envVars:
      - key: MAINTENANCE_JOBS_URL
        sync: false
      - key: MAINTENANCE_EXPIRE_URL
        sync: false
      - key: MAINTENANCE_KEY
        sync: false
