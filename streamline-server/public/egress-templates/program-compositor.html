<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Streamline – Program Compositor</title>
<!--
  LiveKit RoomComposite egress template for every Streamline output
  (multistream RTMP, Instagram, HLS, recordings).

  Query params (LiveKit appends url/token/layout to the customBaseUrl):
    url, token        LiveKit connection (required)
    aspect            "landscape" | "portrait" (default: from window aspect)
    idleEndSec        opt-in: seconds without eligible participants before
                      END_RECORDING (default off; only N > 0 enables it).
                      LiveKit already ends RoomComposite egress when the room
                      closes, and an automatic stop could kill a live stream
                      while the host is reconnecting.

  Layout comes from room metadata `programState` (v2, see
  streamline-server/lib/programPresets.ts).  On-video branding (corner logo,
  background color/image) comes from room metadata `programOverlay` (see
  streamline-server/lib/programOverlayPure.ts).  Resolution logic is imported from
  ./program-layout.mjs, which is generated from that same TypeScript file so
  the egress output and the in-room stage resolve identically.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a0a0a;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #stage {
    position: absolute; overflow: hidden; background: #0a0a0a;
    --label-size: 16px;
  }
  .slot {
    position: absolute; overflow: hidden; background: #111;
    outline: 1px solid #0a0a0a;
  }
  .slot.screen, .slot.fit-contain { background: #000; }
  .slot video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    display: block; background: transparent;
  }
  .slot .ph {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    color: #8a8a8a; font-weight: 600; font-size: calc(var(--label-size) * 1.4);
    text-align: center; padding: 8px;
  }
  .slot.novideo .ph { display: flex; }
  .slot.novideo video { visibility: hidden; }
  .slot .label {
    position: absolute; left: calc(var(--label-size) * 0.6); bottom: calc(var(--label-size) * 0.6);
    max-width: calc(100% - var(--label-size) * 1.2);
    padding: calc(var(--label-size) * 0.2) calc(var(--label-size) * 0.55);
    border-radius: calc(var(--label-size) * 0.35);
    background: rgba(0, 0, 0, 0.6); color: #fff;
    font-size: var(--label-size); line-height: 1.25; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .slot .label:empty { display: none; }
  #placeholder {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #333; font-size: 28px; letter-spacing: 0.08em; font-weight: 700;
  }
  #placeholder.hidden { display: none; }
  #audio-bin { position: absolute; width: 0; height: 0; overflow: hidden; }
  /* Branding: background sits under the slots (z 0), the logo above them. */
  #bg-image {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; z-index: 0; display: none;
  }
  #bg-image.on { display: block; }
  #wm {
    position: absolute; z-index: 10000; display: none; height: auto;
    pointer-events: none;
  }
  #wm.on { display: block; }
  /* Live graphics: banner strip along the bottom, lower third above it. */
  #banner {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 9000; display: none;
    height: calc(var(--label-size) * 2.4); overflow: hidden;
    background: rgba(0, 0, 0, 0.78); border-top: calc(var(--label-size) * 0.18) solid var(--accent, #dc2626);
    color: #fff; font-weight: 600; font-size: calc(var(--label-size) * 1.05);
    align-items: center; white-space: nowrap;
  }
  #banner.on { display: flex; }
  #banner .txt { padding: 0 calc(var(--label-size) * 0.9); overflow: hidden; text-overflow: ellipsis; }
  #banner.scroll .txt {
    overflow: visible; text-overflow: clip; padding-left: 100%;
    animation: sl-marquee var(--marquee-sec, 15s) linear infinite;
  }
  @keyframes sl-marquee { from { transform: translateX(0); } to { transform: translateX(-100%); } }
  #lower-third {
    position: absolute; left: calc(var(--label-size) * 1.2); z-index: 9500; display: none;
    max-width: 60%; padding: calc(var(--label-size) * 0.45) calc(var(--label-size) * 0.9);
    background: rgba(0, 0, 0, 0.78); border-left: calc(var(--label-size) * 0.35) solid var(--accent, #dc2626);
    border-radius: calc(var(--label-size) * 0.2); color: #fff;
  }
  #lower-third.on { display: block; }
  #lower-third .name {
    font-weight: 800; font-size: calc(var(--label-size) * 1.45); line-height: 1.2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #lower-third .title {
    font-weight: 500; font-size: calc(var(--label-size) * 1.0); color: #e5e5e5; line-height: 1.25;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #lower-third .title:empty { display: none; }
</style>
</head>
<body>
  <div id="stage"><img id="bg-image" alt="" /><div id="placeholder">STREAMLINE</div><img id="wm" alt="" /><div id="lower-third"><div class="name"></div><div class="title"></div></div><div id="banner"><span class="txt"></span></div></div>
  <div id="audio-bin"></div>

  <script type="module">
    import {
      Room,
      RoomEvent,
      Track,
    } from "https://cdn.jsdelivr.net/npm/livekit-client@2.22.3/dist/livekit-client.esm.mjs";
    import {
      resolveProgramLayout,
      buildOrientationLayout,
      isHiddenParticipant,
    } from "./program-layout.mjs";

    // Tolerate a second "?" in case the egress appended its params naively
    // to a customBaseUrl that already carried ?aspect=…
    const params = new URLSearchParams(window.location.search.slice(1).replace(/\?/g, "&"));
    const wsUrl = params.get("url");
    const token = params.get("token");
    const aspectParam = (params.get("aspect") || "").toLowerCase();
    const idleEndSec = Math.max(0, Number(params.get("idleEndSec")) || 0); // 0 = disabled (default)

    const stage = document.getElementById("stage");
    const placeholder = document.getElementById("placeholder");
    const audioBin = document.getElementById("audio-bin");
    const bgImage = document.getElementById("bg-image");
    const wm = document.getElementById("wm");
    const lowerThirdEl = document.getElementById("lower-third");
    const bannerEl = document.getElementById("banner");

    function orientation() {
      if (aspectParam === "portrait" || aspectParam === "landscape") return aspectParam;
      return window.innerHeight > window.innerWidth ? "portrait" : "landscape";
    }

    // Fit a uniform 16:9 / 9:16 stage inside the viewport (no stretching).
    function layoutStage() {
      const o = orientation();
      const ar = o === "portrait" ? 9 / 16 : 16 / 9;
      const vw = window.innerWidth, vh = window.innerHeight;
      let w = vw, h = vw / ar;
      if (h > vh) { h = vh; w = vh * ar; }
      stage.style.width = w + "px";
      stage.style.height = h + "px";
      stage.style.left = (vw - w) / 2 + "px";
      stage.style.top = (vh - h) / 2 + "px";
      const short = Math.min(w, h);
      stage.style.setProperty("--label-size", Math.max(12, Math.round(short * 0.03)) + "px");
    }
    window.addEventListener("resize", () => { layoutStage(); render(); });
    layoutStage();

    if (!wsUrl || !token) {
      placeholder.textContent = "Missing url / token";
      throw new Error("Missing LiveKit connection params");
    }

    const room = new Room({ adaptiveStream: false, dynacast: false });
    const firstSeen = new Map(); // trackSid -> ms first observed (publish-order proxy)
    const slotEls = new Map();   // key -> { el, video, ph, label, track }
    const audioEls = new Map();  // trackSid -> { track, el }

    function seen(pub) {
      if (!pub) return null;
      const sid = pub.trackSid;
      if (!firstSeen.has(sid)) firstSeen.set(sid, Date.now());
      return firstSeen.get(sid);
    }

    function programState() {
      try {
        const meta = room.metadata ? JSON.parse(room.metadata) : null;
        return meta && meta.programState ? meta.programState : null;
      } catch { return null; }
    }

    function describe(p) {
      const cam = p.getTrackPublication(Track.Source.Camera);
      const scr = p.getTrackPublication(Track.Source.ScreenShare);
      return {
        identity: p.identity,
        name: p.name || null,
        metadata: p.metadata || null,
        isAgent: !!p.isAgent,
        canPublish: p.permissions ? p.permissions.canPublish !== false : undefined,
        joinedAt: p.joinedAt ? p.joinedAt.getTime() : null,
        camera: cam ? { publishedAt: seen(cam) } : null,
        screen: scr ? { publishedAt: seen(scr) } : null,
      };
    }

    // ---- On-video branding (room metadata `programOverlay`) ----
    // Values are validated server-side; re-checked here because they end up
    // in src/style attributes.
    const HEX = /^#[0-9a-f]{6}$/i;
    const POSITIONS = ["top-left", "top-right", "bottom-left", "bottom-right"];
    function safeUrl(u) {
      if (typeof u !== "string" || !u) return "";
      try {
        const p = new URL(u);
        return p.protocol === "https:" || p.protocol === "http:" ? p.href : "";
      } catch { return ""; }
    }
    function clamp(n, lo, hi, dflt) {
      const v = Number(n);
      return Number.isFinite(v) ? Math.min(hi, Math.max(lo, v)) : dflt;
    }
    function programOverlay() {
      try {
        const meta = room.metadata ? JSON.parse(room.metadata) : null;
        const o = meta && meta.programOverlay;
        return o && o.v === 1 ? o : null;
      } catch { return null; }
    }
    function setText(el, text) {
      const v = typeof text === "string" ? text : "";
      if (el.textContent !== v) el.textContent = v;
    }
    function accentOf(item) {
      return item && HEX.test(item.accent || "") ? item.accent : "#dc2626";
    }
    // Lower third + banner. Returns the banner height (px) so bottom-anchored
    // elements sit above it. A bottom-left logo pushes the lower third right.
    function renderGraphics(o) {
      const banner = o && o.banner && typeof o.banner.text === "string" && o.banner.text ? o.banner : null;
      const lt = o && o.lowerThird && typeof o.lowerThird.name === "string" && o.lowerThird.name ? o.lowerThird : null;
      const label = parseFloat(getComputedStyle(stage).getPropertyValue("--label-size")) || 16;
      let bannerPx = 0;
      if (banner) {
        setText(bannerEl.firstElementChild, banner.text.slice(0, 200));
        bannerEl.style.setProperty("--accent", accentOf(banner));
        bannerEl.classList.toggle("scroll", banner.scroll === true);
        // Same reading speed whatever the length: ~6 characters per second, 8s minimum.
        bannerEl.style.setProperty("--marquee-sec", Math.max(8, Math.round(banner.text.length / 6) + 8) + "s");
        bannerEl.classList.add("on");
        bannerPx = label * 2.4;
      } else {
        bannerEl.classList.remove("on", "scroll");
      }
      if (lt) {
        setText(lowerThirdEl.querySelector(".name"), lt.name.slice(0, 60));
        setText(lowerThirdEl.querySelector(".title"), typeof lt.title === "string" ? lt.title.slice(0, 80) : "");
        lowerThirdEl.style.setProperty("--accent", accentOf(lt));
        lowerThirdEl.style.bottom = Math.round(bannerPx + label * 1.2) + "px";
        const logo = o && o.logo && safeUrl(o.logo.url) && o.logo.position === "bottom-left" ? o.logo : null;
        lowerThirdEl.style.left = logo
          ? `calc(${clamp(logo.size, 4, 30, 12)}% + ${Math.round(label * 2.4)}px)`
          : "";
        lowerThirdEl.classList.add("on");
      } else {
        lowerThirdEl.classList.remove("on");
      }
      return bannerPx;
    }

    function renderOverlay() {
      const o = programOverlay();
      const bannerPx = renderGraphics(o);
      const bg = o && o.background;
      stage.style.background = bg && HEX.test(bg.color || "") ? bg.color : "";
      const bgUrl = bg ? safeUrl(bg.imageUrl) : "";
      if (bgUrl) {
        if (bgImage.getAttribute("src") !== bgUrl) bgImage.setAttribute("src", bgUrl);
        bgImage.classList.add("on");
      } else {
        bgImage.classList.remove("on");
        bgImage.removeAttribute("src");
      }

      const logo = o && o.logo;
      const logoUrl = logo ? safeUrl(logo.url) : "";
      if (!logoUrl) {
        wm.classList.remove("on");
        wm.removeAttribute("src");
        return;
      }
      if (wm.getAttribute("src") !== logoUrl) wm.setAttribute("src", logoUrl);
      const pos = POSITIONS.includes(logo.position) ? logo.position : "top-right";
      const margin = Math.round(Math.min(stage.clientWidth, stage.clientHeight) * 0.03) + "px";
      wm.style.width = clamp(logo.size, 4, 30, 12) + "%";
      wm.style.opacity = String(clamp(logo.opacity, 0.1, 1, 0.9));
      wm.style.top = pos.startsWith("top") ? margin : "";
      wm.style.bottom = pos.startsWith("bottom") ? `calc(${margin} + ${Math.round(bannerPx)}px)` : "";
      wm.style.left = pos.endsWith("left") ? margin : "";
      wm.style.right = pos.endsWith("right") ? margin : "";
      wm.classList.add("on");
    }

    // Legacy (v1) metadata → v2 layout so old rooms still render sensibly.
    function layoutFromState(ps, o) {
      if (!ps) return null;
      if (ps.version === 2 && ps[o]) return ps[o];
      if (o === "landscape" && Array.isArray(ps.programSlots) && ps.programSlots.length) {
        const preset = typeof ps.programLayout === "string" ? buildOrientationLayout(ps.programLayout, "landscape") : null;
        if (preset && preset.slots.length) return preset;
        return {
          presetId: "custom",
          slots: ps.programSlots.slice(0, 9).map((s) => ({
            id: String(s.id), x: s.x / 1280, y: s.y / 720, w: s.width / 1280, h: s.height / 720,
            z: s.zIndex || 1, source: { kind: "auto" },
          })),
        };
      }
      return null;
    }

    function videoTrackFor(identity, kind) {
      const p = room.remoteParticipants.get(identity);
      if (!p) return null;
      const pub = p.getTrackPublication(kind === "screen" ? Track.Source.ScreenShare : Track.Source.Camera);
      if (!pub || !pub.track || pub.isMuted) return null;
      return pub.track;
    }

    let lastResolved = null;
    let startedLogged = false;
    let idleSince = null;
    let ended = false;

    function render() {
      const o = orientation();
      const ps = programState();
      const participants = [];
      for (const p of room.remoteParticipants.values()) participants.push(describe(p));
      const resolved = resolveProgramLayout({
        layout: layoutFromState(ps, o),
        orientation: o,
        screenShareMode: ps && ps.screenShareMode === "manual" ? "manual" : "auto",
        hostIdentity: ps && typeof ps.hostIdentity === "string" ? ps.hostIdentity : null,
        participants,
      });
      lastResolved = resolved;
      window.__compositor = { orientation: o, resolved };

      const live = new Set();
      resolved.slots.forEach((rs, i) => {
        const key = rs.slot.id + "#" + i;
        live.add(key);
        let entry = slotEls.get(key);
        if (!entry) {
          const el = document.createElement("div");
          el.className = "slot";
          const video = document.createElement("video");
          video.autoplay = true; video.playsInline = true; video.muted = true;
          const ph = document.createElement("div"); ph.className = "ph";
          const label = document.createElement("div"); label.className = "label";
          el.append(video, ph, label);
          stage.appendChild(el);
          entry = { el, video, ph, label, track: null };
          slotEls.set(key, entry);
        }
        const s = rs.slot;
        entry.el.style.left = s.x * 100 + "%";
        entry.el.style.top = s.y * 100 + "%";
        entry.el.style.width = s.w * 100 + "%";
        entry.el.style.height = s.h * 100 + "%";
        entry.el.style.zIndex = String(s.z || 1);
        entry.el.classList.toggle("screen", rs.track === "screen");
        entry.el.classList.toggle("fit-contain", rs.fit === "contain");
        entry.el.dataset.identity = rs.identity || "";
        entry.el.dataset.track = rs.track || "";
        entry.video.style.objectFit = rs.fit;

        const track = rs.identity && rs.track ? videoTrackFor(rs.identity, rs.track) : null;
        if (track !== entry.track) {
          if (entry.track) entry.track.detach(entry.video);
          if (track) track.attach(entry.video);
          entry.track = track;
        }
        entry.el.classList.toggle("novideo", !track);
        entry.ph.textContent = !track && rs.identity ? (rs.label || "") : "";
        entry.label.textContent = track && rs.label ? rs.label : "";
      });
      for (const [key, entry] of slotEls) {
        if (live.has(key)) continue;
        if (entry.track) entry.track.detach(entry.video);
        entry.el.remove();
        slotEls.delete(key);
      }
      placeholder.classList.toggle("hidden", resolved.slots.some((r) => !!r.identity));
      renderOverlay();

      syncAudio();
      checkIdle(resolved);
    }

    // Audio from every non-hidden, non-recorder publisher.
    function syncAudio() {
      const want = new Map();
      for (const p of room.remoteParticipants.values()) {
        if (p.isAgent || p.identity.indexOf("EG_") === 0) continue;
        if (isHiddenParticipant({ identity: p.identity, metadata: p.metadata })) continue;
        for (const pub of p.audioTrackPublications.values()) {
          if (pub.track) want.set(pub.trackSid, pub.track);
        }
      }
      for (const [sid, track] of want) {
        if (audioEls.has(sid)) continue;
        const el = track.attach();
        audioBin.appendChild(el);
        audioEls.set(sid, { track, el });
      }
      for (const [sid, a] of audioEls) {
        if (want.has(sid)) continue;
        a.track.detach(a.el);
        a.el.remove();
        audioEls.delete(sid);
      }
    }

    function endRecording(reason) {
      if (ended) return;
      ended = true;
      console.log("[compositor] ending:", reason);
      console.log("END_RECORDING");
    }

    function checkIdle(resolved) {
      if (!idleEndSec || !startedLogged) return;
      const anyone = resolved.slots.some((r) => !!r.identity);
      if (anyone) { idleSince = null; return; }
      if (idleSince === null) idleSince = Date.now();
      else if (Date.now() - idleSince >= idleEndSec * 1000) endRecording("no eligible participants for " + idleEndSec + "s");
    }

    const rerender = () => render();
    room
      .on(RoomEvent.TrackSubscribed, rerender)
      .on(RoomEvent.TrackUnsubscribed, rerender)
      .on(RoomEvent.TrackPublished, rerender)
      .on(RoomEvent.TrackUnpublished, rerender)
      .on(RoomEvent.TrackMuted, rerender)
      .on(RoomEvent.TrackUnmuted, rerender)
      .on(RoomEvent.ParticipantConnected, rerender)
      .on(RoomEvent.ParticipantDisconnected, rerender)
      .on(RoomEvent.ParticipantMetadataChanged, rerender)
      .on(RoomEvent.ParticipantNameChanged, rerender)
      .on(RoomEvent.ParticipantPermissionsChanged, rerender)
      .on(RoomEvent.RoomMetadataChanged, rerender)
      .on(RoomEvent.Disconnected, () => endRecording("disconnected"));

    // Safety net for missed events + idle timer.
    setInterval(render, 1000);

    await room.connect(wsUrl, token);
    render();
    // LiveKit egress starts encoding once this line is logged.
    startedLogged = true;
    console.log("START_RECORDING");
  </script>
</body>
</html>
